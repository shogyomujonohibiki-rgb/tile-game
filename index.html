<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>マージゲーム</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="マージゲーム">
    <link rel="apple-touch-icon" href="icon2.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div style="display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 343px; margin: 0 auto; box-sizing: border-box; padding: 0 4px;">
        <!-- 左寄せ：ユーザー名 -->
        <div style="text-align: left; min-width: 90px;">
            <div id="userNameBoard"
                style="font-size: 12px; font-weight: bold; color: #333; cursor: pointer; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"
                title="クリックして名前を変更">Guest</div>
        </div>

        <!-- 中央：スコア -->
        <div style="text-align: center; flex: 1;">
            <p id="scoreBoard" class="p1" style="margin: 0; display: inline-block;">0</p>
        </div>

        <!-- 右寄せ：メニューボタン -->
        <div style="text-align: right; min-width: 90px;">
            <button id="menuButton"
                style="width: 50px; height: 26px; font-size: 11px; margin: 0; cursor: pointer;">メニュー</button>
        </div>
    </div>
    <p id="highScoreBoard" class="p3">0</p>

    <!-- メニュー・ランキング用モーダル -->
    <div id="menuModal" class="menu-modal hidden">
        <div class="menu-modal-content">
            <div id="menuMainView">
                <h3>メニュー</h3>
                <button id="btnScoreRanking" class="menu-action-btn">スコアランキング</button>
                <button id="btnDungeonRanking" class="menu-action-btn">ダンジョンランキング</button>
                <button id="btnMonsterRanking" class="menu-action-btn">モンスターランキング</button>
                <button id="closeMenuBtn" class="menu-close-btn">閉じる</button>
            </div>

            <!-- スコアランキング詳細ビュー -->
            <div id="scoreRankingView" class="hidden">
                <div class="ranking-header-bar">
                    <button id="backToMenuBtn" class="menu-back-btn">＜ 戻る</button>
                    <h3>スコアランキング</h3>
                </div>
                <div class="ranking-tabs">
                    <button id="tabGlobal" class="ranking-tab active">全国ランキング</button>
                    <button id="tabMy" class="ranking-tab">マイランキング</button>
                </div>
                <div id="rankingListView" class="ranking-list-box">
                    <!-- ランキングデータがここに描画されます -->
                </div>
                <button id="closeScoreRankingBtn" class="menu-close-btn" style="margin-top: 8px;">閉じる</button>
            </div>

            <!-- ダンジョンランキング詳細ビュー -->
            <div id="dungeonRankingView" class="hidden">
                <div class="ranking-header-bar">
                    <button id="backToMenuFromDungeonBtn" class="menu-back-btn">＜ 戻る</button>
                    <h3>ダンジョンランキング</h3>
                </div>
                <div id="dungeonRankingListView" class="ranking-list-box" style="margin-top: 10px;">
                    <!-- ダンジョンランキングデータがここに描画されます -->
                </div>
                <button id="closeDungeonRankingBtn" class="menu-close-btn" style="margin-top: 8px;">閉じる</button>
            </div>
        </div>
    </div>

    <div id="gameArea">
        <!-- 上部：箱庭エリア -->
        <div style="position: relative;">
            <canvas id="topCanvas" width="240" height="290"></canvas>

            <!-- 合体モード用オーバーレイUI -->
            <div id="mergeUIContainer" class="hidden">
                <div class="merge-header">
                    <h2>モンスター合体</h2>
                    <p>ベースにするモンスターと素材を選択</p>
                </div>
                <div class="merge-selection-area">
                    <div class="merge-slot" id="baseMonsterSlot">
                        <h3>ベース (残る)</h3>
                        <div class="slot-content">未選択</div>
                    </div>
                    <div class="merge-plus">+</div>
                    <div class="merge-slot" id="materialMonsterSlot">
                        <h3>素材 (消滅)</h3>
                        <div class="slot-content">未選択</div>
                    </div>
                </div>
                <div class="merge-actions">
                    <button id="executeMergeBtn" disabled>合体実行</button>
                </div>
                <div class="merge-list-container">
                    <h3>所持モンスター一覧</h3>
                    <div id="mergeMonsterList"></div>
                </div>
            </div>
        </div>

        <div id="mainSection">
            <!-- メインの4x4ゲームスペース -->
            <canvas id="gameCanvas" width="200" height="250">
                Canvas not supported.
            </canvas>

            <!-- 右側操作パネル -->
            <div id="controlPanel">
                <div id="timer">00:00.00</div>

                <div id="mergeCountBoard">マージ回数：0</div>

                <!-- コイン残高と+1アイテム交換ボタン -->
                <div id="coinBox" class="item-container">
                    <div id="coinCountBoard">コイン：0</div>
                    <button id="exchangeItemButton">+1交換 (3000)</button>
                </div>

                <div id="itemBox" class="item-container">
                    <div id="itemCountBoard">+1アイテム：0</div>
                    <button id="itemButton">使用</button>
                </div>

                <button id="undoButton">1手戻る</button>
                <button id="game4x4">リセット</button>
            </div>
        </div>
    </div>

    <!-- モード切替ボタンエリア（合体ボタンを削除） -->
    <div id="modeSelectArea">
        <button id="modeMonsterGet" class="active">スカウト</button>
        <button id="modeDungeon">ダンジョン</button>
    </div>

    <!-- Firebase初期化モジュール -->
    <script type="module" src="firebase-config.js"></script>
    <!-- メインエントリーポイント -->
    <script type="module" src="main.js"></script>
</body>

</html>
