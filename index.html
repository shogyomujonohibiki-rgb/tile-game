<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>マージゲーム</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="マージゲーム">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p id="scoreBoard" class="p1">0</p>
    <p id="highScoreBoard" class="p3">0</p>
    <div id="gameArea">
        <!-- 上部：箱庭エリア -->
        <div style="position: relative;">
            <canvas id="topCanvas" width="240" height="290"></canvas>
            
            <!-- 合体モード用オーバーレイUI -->
            <div id="mergeUIContainer" class="hidden">
                <div class="merge-header">
                    <h2>モンスター合体</h2>
                    <p>ベースにするモンスターと素材を選択</p>
                </div>
                <div class="merge-selection-area">
                    <div class="merge-slot" id="baseMonsterSlot">
                        <h3>ベース (残る)</h3>
                        <div class="slot-content">未選択</div>
                    </div>
                    <div class="merge-plus">+</div>
                    <div class="merge-slot" id="materialMonsterSlot">
                        <h3>素材 (消滅)</h3>
                        <div class="slot-content">未選択</div>
                    </div>
                </div>
                <div class="merge-actions">
                    <button id="executeMergeBtn" disabled>合体実行</button>
                </div>
                <div class="merge-list-container">
                    <h3>所持モンスター一覧</h3>
                    <div id="mergeMonsterList"></div>
                </div>
            </div>
        </div>

        <div id="mainSection">
            <!-- メインの4x4ゲームスペース -->
            <canvas id="gameCanvas" width="200" height="250">
                Canvas not supported.
            </canvas>

            <!-- 右側操作パネル -->
            <div id="controlPanel">
                <div id="timer">00:00.00</div>

                <div id="mergeCountBoard">マージ回数：0</div>

                <div id="itemBox" class="item-container">
                    <div id="itemCountBoard">+1アイテム：0</div>
                    <button id="itemButton">使用</button>
                </div>

                <button id="undoButton">1手戻る</button>
                <button id="game4x4">リセット</button>
            </div>
        </div>
    </div>

    <!-- モード切替ボタンエリア（合体ボタンを追加） -->
    <div id="modeSelectArea">
        <button id="modeMonsterGet" class="active">スカウト</button>
        <button id="modeDungeon">ダンジョン</button>
        <button id="modeMerge">合体</button>
    </div>

    <!-- Firebase初期化モジュール -->
    <script type="module" src="firebase-config.js"></script>
    <!-- メインエントリーポイント -->
    <script type="module" src="main.js"></script>
</body>
</html>
