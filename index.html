<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>マージゲーム</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="マージゲーム">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p id="scoreBoard" class="p1">0</p>
    <p id="mergeCountBoard" class="p2">マージ回数：0</p>
    <div id="itemPanel">
        <p id="itemCountBoard" class="p2">+1アイテム：0</p>
        <button id="itemButton">使用</button>
    </div>
    <p id="highScoreBoard" class="p3">0</p>
    <div id="colorSample"></div>
    <div>
        <canvas width="240" height="250">
            Canvas not supported.
        </canvas>
    </div>
    <div id="controlPanel">
        <div id="timer">00:00.00</div>
        <div id="gameSelect">
            <button id="undoButton">1手戻る</button>
            <button id="game4x4">リセット</button>
        </div>
    </div>

    <!-- Firebase SDK (ES Modules) 初期化設定 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            collection,
            query,
            where,
            orderBy,
            limit,
            getDocs,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Firebaseコンソールの設定情報
        const firebaseConfig = {
            apiKey: "AIzaSyAK9WpeKAKNeBmNCv-IIn3_ICQtuifeUoM",
            authDomain: "merge-game-4ca92.firebaseapp.com",
            projectId: "merge-game-4ca92",
            storageBucket: "merge-game-4ca92.firebasestorage.app",
            messagingSenderId: "777141437539",
            appId: "1:777141437539:web:47275b67f5e199624a2456"
        };

        // Firebase初期化
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.currentUser = null;

        // --- データ読み込み用関数 ---
        window.loadUserDataFromFirestore = async () => {
            if (!window.currentUser) return null;
            try {
                const userRef = doc(db, "users", window.currentUser.uid);
                const docSnap = await getDoc(userRef);
                if (docSnap.exists()) {
                    return docSnap.data();
                }
            } catch (error) {
                console.error("データ読み込み失敗:", error);
            }
            return null;
        };

        // --- データ保存用関数 ---
        window.saveUserDataToFirestore = async (data) => {
            if (!window.currentUser) return;
            try {
                const userRef = doc(db, "users", window.currentUser.uid);
                await setDoc(userRef, {
                    ...data,
                    updatedAt: new Date()
                }, { merge: true });
                console.log("Firestoreへの保存成功:", data);
            } catch (error) {
                console.error("データ保存失敗:", error);
            }
        };

        // --- プレイごとのスコア保存用関数 ---
        window.saveScoreToFirestore = async (score, mergeCount = 0, userName = null) => {
            if (!window.currentUser) return;
            try {
                const currentName = userName
                    || localStorage.getItem('gameUserName')
                    || window.currentUser.displayName
                    || window.currentUser.userName
                    || 'Guest';

                const scoresRef = collection(db, "scores");
                await addDoc(scoresRef, {
                    uid: window.currentUser.uid,
                    userName: currentName,
                    score: score,
                    createdAt: serverTimestamp()
                });
                console.log("スコアの保存に成功しました:", score, "ユーザー名:", currentName);
            } catch (error) {
                console.error("スコア保存失敗:", error);
            }
        };

        // --- ランキング取得用関数 ---
        window.fetchLeaderboardFromFirestore = async function (limitCount = 20) {
            try {
                const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(limitCount));
                const querySnapshot = await getDocs(q);

                const leaderboard = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    leaderboard.push({
                        userName: data.userName || 'Guest',
                        score: data.score || 0,
                        createdAt: data.createdAt ? data.createdAt.toDate() : new Date()
                    });
                });
                return leaderboard;
            } catch (error) {
                console.error("ランキングの取得に失敗しました:", error);
                return [];
            }
        };

        // --- マイランキング／個人の履歴取得用関数 ---
        window.fetchMyLeaderboardFromFirestore = async function (uid, limitCount = 20) {
            const targetUid = uid || (window.currentUser ? window.currentUser.uid : null);
            if (!targetUid) {
                console.warn("uid が指定されていないため、マイランキングを取得できません。");
                return [];
            }

            try {
                const q = query(
                    collection(db, "scores"),
                    where("uid", "==", targetUid),
                    orderBy("score", "desc"),
                    limit(limitCount)
                );
                const querySnapshot = await getDocs(q);

                const leaderboard = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const dateObj = data.createdAt ? data.createdAt.toDate() : new Date();

                    const year = dateObj.getFullYear();
                    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const day = String(dateObj.getDate()).padStart(2, '0');
                    const formattedDate = `${year}/${month}/${day}`;

                    leaderboard.push({
                        dateStr: formattedDate,
                        score: data.score || 0
                    });
                });
                return leaderboard;
            } catch (error) {
                console.error("マイランキングの取得エラー:", error);
                return [];
            }
        };

        // ログイン監視
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                console.log("ログイン中 UID:", user.uid);
                window.dispatchEvent(new Event('firebase-ready'));
            } else {
                try {
                    const cred = await signInAnonymously(auth);
                    window.currentUser = cred.user;
                    window.dispatchEvent(new Event('firebase-ready'));
                } catch (error) {
                    console.error("ログイン失敗:", error);
                }
            }
        });
    </script>

    <script src="main.js" defer></script>

    <!-- Service Workerの登録 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=9').then((registration) => {
                    const checkUpdate = () => {
                        registration.update().catch(err => console.error('SW Update check failed:', err));
                    };

                    checkUpdate();
                    document.addEventListener('visibilitychange', () => {
                        if (document.visibilityState === 'visible') {
                            checkUpdate();
                        }
                    });

                    registration.onupdatefound = () => {
                        const installingWorker = registration.installing;
                        if (installingWorker == null) return;

                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed') {
                                if (navigator.serviceWorker.controller) {
                                    console.log('新しいバージョンが更新されました。');
                                }
                            }
                        };
                    };
                }).catch((error) => {
                    console.error('Service Worker 登録失敗:', error);
                });
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }
    </script>
</body>

</html>
