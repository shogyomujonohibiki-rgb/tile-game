<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>マージゲーム</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="マージゲーム">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p id="scoreBoard" class="p1">0</p>
    <p id="highScoreBoard" class="p3">0</p>
    <div id="colorSample"></div>

    <div id="gameArea">
        <!-- 上部：箱庭エリア -->
        <canvas id="topCanvas" width="240" height="150"></canvas>

        <div id="mainSection">
            <!-- メインの4x4ゲームスペース -->
            <canvas id="gameCanvas" width="200" height="250">
                Canvas not supported.
            </canvas>

            <!-- 右側操作パネル -->
            <div id="controlPanel">
                <div id="timer">00:00.00</div>

                <div id="mergeCountBoard">マージ回数：0</div>

                <div id="itemBox" class="item-container">
                    <div id="itemCountBoard">+1アイテム：0</div>
                    <button id="itemButton">使用</button>
                </div>

                <button id="undoButton">1手戻る</button>
                <button id="game4x4">リセット</button>
            </div>
        </div>
    </div>

    <!-- モード切替およびパーティー編成ボタンエリア -->
    <div id="modeSelectArea">
        <button id="modeMonsterGet" class="active">スカウト</button>
        <button id="modeDungeon">ダンジョン</button>
        <button id="partyButton">パーティー編成</button>
    </div>

    <!-- パーティー編成モーダル画面 -->
    <div id="partyModal">
        <div class="party-modal-content">
            <h3>パーティー編成 (最大6匹)</h3>
            <div id="partySelectionList">
                <!-- 所持モンスター一覧が動的に入ります -->
            </div>
            <p id="partyCountText">選択中: 0 / 6</p>
            <button id="closePartyModal">決定・閉じる</button>
        </div>
    </div>

    <!-- Firebase初期化モジュール -->
    <script type="module" src="firebase-config.js"></script>
    <!-- メインエントリーポイント -->
    <script type="module" src="main.js"></script>
</body>
</html>
