<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>マージゲーム</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="マージゲーム">
    <link rel="apple-touch-icon" href="icon.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p id="scoreBoard" class="p1">0</p>
    <p id="highScoreBoard" class="p3">0</p>
    <div id="colorSample"></div>

    <div id="gameArea">
        <!-- 上部：箱庭エリア（シンプルな黒背景） -->
        <canvas id="topCanvas" width="240" height="150"></canvas>

        <div id="mainSection">
            <!-- メインの4x4ゲームスペース -->
            <canvas id="gameCanvas" width="200" height="250">
                Canvas not supported.
            </canvas>

            <!-- 右側操作パネル -->
            <div id="controlPanel">
                <div id="timer">00:00.00</div>

                <div id="mergeCountBoard">マージ回数：0</div>

                <div id="itemBox" class="item-container">
                    <div id="itemCountBoard">+1アイテム：0</div>
                    <button id="itemButton">使用</button>
                </div>

                <!-- パーティー編成ボタン -->
                <button id="partyButton">パーティー編成</button>

                <button id="undoButton">1手戻る</button>
                <button id="game4x4">リセット</button>
            </div>
        </div>
    </div>

    <!-- パーティー編成モーダル画面 -->
    <div id="partyModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; width: 90%; max-width: 320px; padding: 16px; border-radius: 8px; box-sizing: border-box; text-align: center; color: #333;">
            <h3 style="margin-top: 0;">パーティー編成 (最大6匹)</h3>
            <div id="partySelectionList" style="max-height: 220px; overflow-y: auto; border: 1px solid #ccc; margin-bottom: 12px; padding: 8px; text-align: left;">
                <!-- 所持モンスター一覧が動的に入ります -->
            </div>
            <p id="partyCountText" style="font-size: 12px; margin-bottom: 12px;">選択中: 0 / 6</p>
            <button id="closePartyModal" style="all: unset; background-color: #555; color: white; width: 100%; height: 36px; border-radius: 4px; cursor: pointer; font-weight: bold;">決定・閉じる</button>
        </div>
    </div>

    <!-- Firebase SDK (ES Modules) 初期化設定 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            collection,
            query,
            where,
            orderBy,
            limit,
            getDocs,
            addDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAK9WpeKAKNeBmNCv-IIn3_ICQtuifeUoM",
            authDomain: "merge-game-4ca92.firebaseapp.com",
            projectId: "merge-game-4ca92",
            storageBucket: "merge-game-4ca92.firebasestorage.app",
            messagingSenderId: "777141437539",
            appId: "1:777141437539:web:47275b67f5e199624a2456"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.currentUser = null;

        let authResolve = null;
        let authPromise = new Promise((resolve) => {
            authResolve = resolve;
        });

        async function ensureAuth() {
            if (window.currentUser) return window.currentUser;
            return await authPromise;
        }

        window.loadUserDataFromFirestore = async () => {
            try {
                const user = await ensureAuth();
                if (!user) return null;

                const userRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(userRef);
                if (docSnap.exists()) {
                    return docSnap.data();
                }
            } catch (error) {
                console.error("データ読み込み失敗:", error);
            }
            return null;
        };

        window.saveUserDataToFirestore = async (data) => {
            try {
                const user = await ensureAuth();
                if (!user) return;

                const userRef = doc(db, "users", user.uid);
                await setDoc(userRef, {
                    ...data,
                    updatedAt: new Date()
                }, { merge: true });
            } catch (error) {
                console.error("データ保存失敗:", error);
            }
        };

        window.saveScoreToFirestore = async (score, mergeCount = 0, userName = null) => {
            try {
                const user = await ensureAuth();
                if (!user) return;

                const currentName = userName
                    || localStorage.getItem('gameUserName')
                    || user.displayName
                    || user.userName
                    || 'Guest';

                const scoresRef = collection(db, "scores");
                await addDoc(scoresRef, {
                    uid: user.uid,
                    userName: currentName,
                    score: score,
                    createdAt: serverTimestamp()
                });
            } catch (error) {
                console.error("スコア保存失敗:", error);
            }
        };

        window.fetchLeaderboardFromFirestore = async function (limitCount = 20) {
            try {
                const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(limitCount));
                const querySnapshot = await getDocs(q);

                const leaderboard = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    leaderboard.push({
                        userName: data.userName || 'Guest',
                        score: data.score || 0,
                        createdAt: data.createdAt ? data.createdAt.toDate() : new Date()
                    });
                });
                return leaderboard;
            } catch (error) {
                console.error("ランキングの取得に失敗しました:", error);
                return [];
            }
        };

        window.fetchMyLeaderboardFromFirestore = async function (uid, limitCount = 20) {
            try {
                const user = await ensureAuth();
                const targetUid = uid || (user ? user.uid : null);
                if (!targetUid) return [];

                const q = query(
                    collection(db, "scores"),
                    where("uid", "==", targetUid),
                    orderBy("score", "desc"),
                    limit(limitCount)
                );
                const querySnapshot = await getDocs(q);

                const leaderboard = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const dateObj = data.createdAt ? data.createdAt.toDate() : new Date();

                    const year = dateObj.getFullYear();
                    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                    const day = String(dateObj.getDate()).padStart(2, '0');

                    leaderboard.push({
                        dateStr: `${year}/${month}/${day}`,
                        score: data.score || 0
                    });
                });
                return leaderboard;
            } catch (error) {
                console.error("マイランキングの取得エラー:", error);
                return [];
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                window.currentUser = user;
                if (authResolve) {
                    authResolve(user);
                    authResolve = null;
                }
                window.dispatchEvent(new Event('firebase-ready'));
            } else {
                try {
                    const cred = await signInAnonymously(auth);
                    window.currentUser = cred.user;
                    if (authResolve) {
                        authResolve(cred.user);
                        authResolve = null;
                    }
                    window.dispatchEvent(new Event('firebase-ready'));
                } catch (error) {
                    console.error("ログイン失敗:", error);
                    if (authResolve) {
                        authResolve(null);
                        authResolve = null;
                    }
                }
            }
        });
    </script>

    <script type="module" src="main.js"></script>
</body>
</html>
